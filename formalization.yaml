# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Mader's theorem on highly connected subgraphs"
  description: >-
    A Lean 4 / Mathlib formalization of Mader's 1972 theorem in the form of Diestel's Theorem
    1.4.3: for k ≥ 1, every nonempty finite simple graph with average degree at least 4k has a
    (k + 1)-connected induced subgraph H with e(H)/|H| > e(G)/|G| − k. Vertex connectivity is
    defined by deletion of fewer than k vertices (same definition as in the Menger–Hamiltonicity
    entry). Mathlib does not contain vertex connectivity or this theorem.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C40", "05C35"]

sources:
  - title: "Existenz n-fach zusammenhängender Teilgraphen in Graphen genügend großer Kantendichte"
    authors:
      - "W. Mader"
    id: "doi:10.1007/BF02993903"
    type: "paper"
    location: "Abhandlungen aus dem Mathematischen Seminar der Universität Hamburg 37 (1972), 86–97"
    relationship: "formalizes"
    note: "Graphs of large average degree contain highly connected subgraphs."
    license: "all rights reserved"
    author_endorsement: "n/a"
  - title: "Graph Theory"
    authors:
      - "R. Diestel"
    type: "book"
    location: "Graduate Texts in Mathematics 173, Springer, Theorem 1.4.3"
    relationship: "background"
    note: "Form of the statement and proof followed here."
    license: "all rights reserved"
    author_endorsement: "n/a"

status:
  scope: >-
    The theorem is proved in Diestel's form for every k ≥ 1 and every nonempty finite simple
    graph: average degree at least 4k gives a (k + 1)-connected induced subgraph H with
    e(H)/|H| > e(G)/|G| − k. Mader's sharper constants are not stated.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Given the formal statement and Diestel's proof plan, Aristotle proved the theorem in one
        run, keeping all inequalities as integer statements. The return was audited (statement,
        definition and headers unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "under one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design and small-case checks, proof plan, review of the Aristotle return, and
        the Palomar packaging, checked with `lake build`, `#print axioms` and a comparison of the
        elaborated Challenge and Solution declarations (Lean v4.35.0-rc3, Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean proofs are AI-generated and mechanically
    verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, identical
    elaborated types and definitions for the Challenge/Solution pair).

fidelity:
  divergences: >-
    The subgraph is induced (G.induce S), which is equivalent because adding edges preserves
    k-connectivity and only increases e(H). Average degree ≥ 4k is stated as
    4k·|V| ≤ 2·e(G) and V is assumed nonempty. k-connectivity means more than k vertices and
    connectedness after deleting any set of fewer than k vertices.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statement with Diestel's Theorem 1.4.3 and Mader (1972), checked the degenerate cases (empty vertex set) and K₅ with k = 1, checked that the statements returned by Aristotle are unchanged, and confirmed by `lake build`, `#print axioms` and a comparison of the fully
    elaborated Challenge and Solution declarations that the proofs use no `sorry` and only
    propext, Classical.choice and Quot.sound. The author directed the work and approved the
    statements. No independent human mathematical review has been performed. The result is
    classical; no mathematical novelty is claimed.

alignment:
  namespace: "MaderTheorem"
  statements:
    - source: "Mader (1972), Diestel Theorem 1.4.3: d(G) ≥ 4k ⇒ (k+1)-connected subgraph H with ε(H) > ε(G) − k"
      lean: "MaderTheorem.mader"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
